<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 440" data-graphic-id="g3" role="img" aria-label="Golden Ratio Projectivity in Pappus&#x27;s Hexagon over Q(phi)">
  <title>Golden Ratio Projectivity in Pappus&#x27;s Hexagon over Q(phi)</title>
  <style>
