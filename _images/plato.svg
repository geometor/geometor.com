      <path class="geom-line quad-line" d="M 438.9 173.14 L 379.45 173.14 L 320 173.14" data-ref="[ B H ]" data-aliases="[ B D ] | [ D B ] | / B D /" fill="none"><title>[ B H ]: (0)*x + (1)*y + (-1) = 0</title></path>
      <path class="geom-line carrier-line" d="M 201.1 292.04 L 320 292.04 L 438.9 292.04" data-ref="[ O C ]" data-aliases="[ C O ] | / O C / | [ O A ] | [ A O ] | / O A / | [ C A ] | [ A C ] | / C A /" fill="none"><title>[ O C ]: (0)*x + (1)*y + (0) = 0</title></path>
      <path class="geom-line carrier-line" d="M 320 173.14 L 320 232.59 L 320 292.04" data-ref="[ O B ]" data-aliases="[ B O ] | / O B /" fill="none"><title>[ O B ]: (1)*x + (0)*y + (0) = 0</title></path>
      <path class="geom-line pappus-line pappus-even" d="M 320 292.04 L 379.45 232.59 L 438.9 173.14" data-ref="[ O D ]" data-aliases="[ D O ] | / O D /" fill="none"><title>[ O D ]: (-1)*x + (1)*y + (0) = 0</title></path>
      <path class="geom-line harmonic-line" d="M 438.9 173.14 L 396.86 131.1 L 354.83 89.06" data-ref="[ D K ]" data-aliases="[ D E ] | [ E D ] | / D E /" fill="none"><title>[ D K ]: (-1)*x + (-1)*y + (2) = 0</title></path>
      <path class="geom-line steiner-line" d="M 320 292.04 L 337.41 190.55 L 354.83 89.06" data-ref="[ O E ]" data-aliases="[ E O ] | / O E /" fill="none"><title>[ O E ]: (-1 - sqrt(2)/2)*x + (1 - sqrt(2)/2)*y + (0) = 0</title></path>
    </g>
