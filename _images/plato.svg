<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 640 500" data-graphic-id="foundations-peras" role="img" aria-label="Parmenides 137e, Philebus 51c &amp; Laws VII 819d: Compass, Straight Ray &amp; 1-sqrt(2)-sqrt(3) Triad">
  <title>Parmenides 137e, Philebus 51c &amp; Laws VII 819d: Compass, Straight Ray &amp; 1-sqrt(2)-sqrt(3) Triad</title>
