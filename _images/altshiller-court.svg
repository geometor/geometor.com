<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" class="euclid-graphic" data-graphic-id="hero-apollonian_locus.apollonian_locus" data-folio="hero-apollonian_locus" data-graphic="apollonian_locus">
  <style>
