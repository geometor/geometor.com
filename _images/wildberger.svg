    <g class="svg-control-btn" data-action="zoom-out"><rect x="4.6775" y="-7.9875" width="0.5312" height="0.3427" /><text x="4.9431" y="-7.8161" style="font-size:0.1542px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="5.2704" y="-7.9875" width="0.5312" height="0.3427" /><text x="5.5360" y="-7.8161" style="font-size:0.1542px">⟲</text></g>
