  <text x="380.0" y="382.0" class="lbl-caption" text-anchor="middle">Pasch (1882) § 1 Grundsätze V–VIII &amp; Lehrsätze 19–23: C lies between A and B while D lies outside AB, yielding invariant pair separation AB // CD</text>
