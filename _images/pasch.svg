<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" class="euclid-graphic" role="img" aria-label="Moritz Pasch (1882) §§ 1 &amp; 11: Open Linear Betweenness vs. 4-Point Projective Separation">
<title>Moritz Pasch (1882) §§ 1 &amp; 11: Open Linear Betweenness vs. 4-Point Projective Separation</title>
<desc>Segment interior points C between A and B vs. exterior point D, showing pair separation AB // CD preserved across perspective section.</desc>
<style>
  .euclid-graphic {
    display: block;
