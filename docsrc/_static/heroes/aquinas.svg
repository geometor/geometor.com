<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="auto">
  <style>
    svg {
      --svg-bg: #fafaf9;
      --geom-fg: #1c1917;
      --geom-muted: #64748b;
      --geom-halo: rgba(250, 250, 249, 0.92);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: var(--svg-bg);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --svg-bg: #141417;
        --geom-fg: #f4f4f5;
        --geom-muted: #94a3b8;
        --geom-halo: rgba(20, 20, 23, 0.92);
      }
    }
    .svg-bg { fill: var(--svg-bg); }
    .geom-line, .geom-circle, .geom-arc { fill: none; stroke: var(--geom-fg); stroke-linecap: round; stroke-linejoin: round; }
    .geom-point { fill: var(--geom-fg); stroke: var(--svg-bg); stroke-width: 1.2; }
    .geom-label { fill: var(--geom-fg); font-size: 13px; font-weight: 600; paint-order: stroke; stroke: var(--geom-halo); stroke-width: 3.5px; }
  </style>
  <rect class="svg-bg" x="0" y="0" width="600" height="360" />
  <rect width="600" height="360" rx="8" fill="#0c1017" stroke="#1e293b" stroke-width="1.5"/>
  <defs>
    <linearGradient id="geomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <line x1="80" y1="180" x2="520" y2="180" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="300" y1="50" x2="300" y2="310" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="300" cy="180" r="105" fill="none" stroke="#334155" stroke-width="1.2"/>
  <circle cx="300" cy="180" r="70" fill="#0284c7" fill-opacity="0.08" stroke="url(#geomGrad)" stroke-width="2"/>
  <line x1="160" y1="110" x2="440" y2="250" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="160" y1="250" x2="440" y2="110" stroke="#00d2ff" stroke-width="1.8"/>
  <circle cx="300" cy="180" r="4.5" fill="#f8fafc"/>
  <circle cx="230" cy="145" r="4" fill="#00d2ff"/>
  <circle cx="370" cy="215" r="4" fill="#00d2ff"/>
  <circle cx="230" cy="215" r="4" fill="#f59e0b"/>
  <circle cx="370" cy="145" r="4" fill="#f59e0b"/>
  <text x="300" y="75" fill="#f8fafc" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Book I, Lecture 1 — On the Necessity of Logic</text>
  <text x="300" y="325" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Lib. I, lect. 1 · Scientia Mathematica et Materia Intelligibilis</text>
</svg>