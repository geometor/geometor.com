<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 780 460" role="img" aria-label="Von Staudt §§ 7–8 (Art. 93): Complete Quadrangle Harmonic Fourth &amp; Desarguesian Uniqueness">
  <title>Von Staudt §§ 7–8 (Art. 93): Complete Quadrangle Harmonic Fourth &amp; Desarguesian Uniqueness</title>
  <desc>Upper quadrangle EFGH and lower quadrangle E&#x27;F&#x27;G&#x27;H&#x27; sharing A, B, C both intersect line AB in the unique fourth harmonic conjugate D = (-6, 0).</desc>
  <style>
