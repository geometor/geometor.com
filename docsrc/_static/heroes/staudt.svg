  <text x="390.00" y="442.00" text-anchor="middle" class="diagram-caption">Geometrie der Lage §§ 7–8 (Art. 93): Independent quadrangles EFGH and E&#x27;F&#x27;G&#x27;H&#x27; determine the identical harmonic fourth D with (A, B; C, D) = −1</text>
