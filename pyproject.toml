[project]
name = "geometor-com"
dynamic = ["version"]
authors = [
  { name = "phi ARCHITECT", email = "github@geometor.com" },
]
description = "Central portal and narrative threshold for GEOMETOR — Exploring the Architecture of All That Is."
readme = "README.rst"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy",
]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.com.__version__"}

[project.urls]
"Website" = "https://geometor.com"
"Repository" = "https://github.com/geometor/geometor.com"
"Discussions" = "https://github.com/orgs/geometor/discussions"
"YouTube" = "https://www.youtube.com/@geometor"
